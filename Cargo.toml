[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/TODO/elysium"
publish = false

[workspace.dependencies]
ruby_source = { path = "crates/ruby_source" }
ruby_ast = { path = "crates/ruby_ast" }
ruby_directives = { path = "crates/ruby_directives" }
ruby_semantic = { path = "crates/ruby_semantic" }
linter = { path = "crates/linter" }
rules = { path = "crates/rules" }
config = { path = "crates/config" }
cache = { path = "crates/cache" }

ruby-prism = "1.9.0"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
criterion = { version = "0.8", default-features = false }
insta = "1.48"
regex = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
saphyr = "0.0.12"
tempfile = "3"
unicode-width = "0.2.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"

[patch.crates-io]
# Upstream 1.9.0 plus an additive `parse_with_options`; see docs/adr/0002-vendor-ruby-prism.md.
ruby-prism = { path = "vendor/ruby-prism" }

name: corpus

# Real-world conformance: builds elysium once, then for each corpus app
# clones it at a pinned commit and checks that elysium's offenses match real
# RuboCop's over the same 49-cop rule set (ci/corpus/rules.txt). Workflow
# logic lives in ci/corpus/*.sh so it can be run the same way locally; this
# file just wires up runners, caching, and artifact handoff.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cli
      - uses: actions/upload-artifact@v4
        with:
          name: elysium-linux
          path: target/release/elysium
          if-no-files-found: error

  corpus:
    name: corpus (${{ matrix.app }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # forem is intentionally excluded: it pins RuboCop 1.63.4 (see
        # docs/conformance/rules.md's per-app `rubocop` column), whose cop
        # behaviour differs from the 1.82+ semantics elysium implements
        # (version-skew rows there are annotated `[^skew-*]`). Comparing
        # against it would report elysium bugs that are really just
        # RuboCop-itself-changed-since-1.63 differences.
        app: [discourse, mastodon]
    # ruby/setup-ruby's bundler-cache reads $BUNDLE_GEMFILE for every step in
    # this job, so it must be set at the job level (not just for one step)
    # to point bundler at this app's side Gemfile instead of the repo root.
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/ci/corpus/${{ matrix.app }}/Gemfile
    steps:
      - uses: actions/checkout@v4

      - name: read pinned commit
        id: app-meta
        run: |
          commit=$(grep '^COMMIT=' "ci/corpus/${{ matrix.app }}/app.env" | cut -d= -f2)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: cache app checkout
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/corpus-${{ matrix.app }}
          key: corpus-${{ matrix.app }}-${{ steps.app-meta.outputs.commit }}

      # Ruby >= 3.2 for rubocop-discourse/rubocop-discourse-base (discourse
      # and mastodon's plugins).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: download elysium
        uses: actions/download-artifact@v4
        with:
          name: elysium-linux
          path: target/release

      - run: chmod +x target/release/elysium

      - run: ci/corpus/run.sh ${{ matrix.app }}

      - name: upload corpus artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.app }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/corpus-${{ matrix.app }}/rubocop.json
            ${{ runner.temp }}/corpus-${{ matrix.app }}/elysium.json
            ${{ runner.temp }}/corpus-${{ matrix.app }}/compare.txt

name: bench

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Smoke test only: proves the criterion harness still builds and runs,
      # does not gate the PR on timing.
      - name: cargo bench (smoke)
        run: cargo bench -p linter --bench pipeline -- --quick

      - name: clone gitlab-foss corpus
        run: git clone --depth 1 --filter=blob:none https://gitlab.com/gitlab-org/gitlab-foss.git corpus/gitlab

      # The medians in benchmarks/results.json were recorded on an Apple M4
      # laptop; a GitHub-hosted runner is slower and noisier, so a >5%
      # "regression" here is expected and only warned about (exit code 3).
      # Any other non-zero exit is a harness failure (crash, unparsable
      # stats, missing corpus) and fails the job. TODO: once a CI-recorded
      # baseline exists in benchmarks/results.json, fail on exit code 3 too.
      - name: cargo xtask bench --check
        run: |
          set +e
          cargo xtask bench --check --runs 3 --corpus "$GITHUB_WORKSPACE/corpus/gitlab"
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning::benchmark regression against the laptop-recorded baseline (not gated on CI runners)"
            exit 0
          fi
          exit "$rc"

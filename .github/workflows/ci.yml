name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ruby-prism-sys compiles Prism's vendored C sources; build-essential
      # ships by default on the ubuntu-latest runner image, and Xcode's
      # command line tools provide a C toolchain on macos-latest, so no
      # extra setup step is needed on either runner.
      - run: cargo test --workspace

  rubocop-pin:
    # Everything taken from RuboCop must come from the version the corpus job
    # checks against (pinned in ci/corpus/*/Gemfile): the embedded
    # config/default.yml and config/obsoletion.yml verbatim, and every fixture
    # exactly as tools/port_spec.rb generates it from that version's specs,
    # minus crates/rules/fixtures/REMOVED.txt. The same holds for each
    # extension gem tools/extension_gems.rb pins: its vendored
    # config/default.yml, and its department's fixtures from its own suite.
    name: matches pinned RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: RuboCop version pinned by the corpus Gemfiles
        id: pin
        run: echo "version=$(ruby -e 'print File.read("ci/corpus/discourse/Gemfile")[/gem "rubocop", "([^"]+)"/, 1]')" >> "$GITHUB_OUTPUT"
      - name: Install RuboCop, the pinned extension gems and spec dependencies
        run: |
          # The suites' own dependencies (tools/extension_gems.rb `gemfile`):
          # rubocop-thread_safety's spec_helper needs simplecov,
          # rubocop-minitest's test_helper minitest 5 and minitest-proveit,
          # rubocop-sorbet's test_helper minitest, mocha, debug and
          # rubocop-minitest 0.38.1.
          gem install --no-document "rubocop:${{ steps.pin.outputs.version }}" rspec 'mcp:~> 0.6' \
            simplecov 'minitest:~> 5.11' minitest-proveit minitest mocha debug rubocop-minitest:0.38.1
          while read -r key gem version repository tag vendored; do
            gem install --no-document "$gem:$version"
          done < <(ruby tools/extension_gems.rb)
      - name: RuboCop and extension gem sources (specs/tests)
        run: |
          git clone --quiet --depth 1 --branch "v${{ steps.pin.outputs.version }}" https://github.com/rubocop/rubocop.git "$RUNNER_TEMP/rubocop"
          gem_src=""
          while read -r key gem version repository tag vendored; do
            git clone --quiet --depth 1 --branch "$tag" "$repository" "$RUNNER_TEMP/$gem-$version"
            gem_src="${gem_src:+$gem_src,}$key=$RUNNER_TEMP/$gem-$version"
          done < <(ruby tools/extension_gems.rb)
          echo "GEM_SRC=$gem_src" >> "$GITHUB_ENV"
      - name: Embedded config files are the pinned versions'
        run: |
          diff -u "$RUNNER_TEMP/rubocop/config/default.yml" crates/config/rubocop/default.yml
          diff -u "$RUNNER_TEMP/rubocop/config/obsoletion.yml" crates/config/rubocop/obsoletion.yml
          while read -r key gem version repository tag vendored; do
            diff -u "$RUNNER_TEMP/$gem-$version/config/default.yml" "$vendored"
          done < <(ruby tools/extension_gems.rb)
      - run: ruby tools/check_fixtures.rb --rubocop-src "$RUNNER_TEMP/rubocop" --gem-src "$GEM_SRC" --jobs 4

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
